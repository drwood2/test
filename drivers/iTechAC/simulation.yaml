spec: "1.1"

# 1. Define the simulated device and how it responds to SCPI commands
devices:
  mock_power_supply:
    eom:
      TCPIP SOCKET:
        q: "\n"
        r: "\n"
    error: ERROR
    dialogues:
      # Representative IT7900EP reply, in the format the IT7900P Programming Guide documents:
      # manufacturer, model, serial number, then firmware versions
      - q: "*IDN?"
        r: "Itech Electronics,IT7942EP-350-210,800000000000000002,000.001.038,83.R,13.R"
      - q: "*RST"
      - q: "MEASURE:CURRENT?"
        r: "1.234"
      # Grid simulation actions from the IT7900P Programming Guide
      - q: "INITIATE:SURGESAG"
      - q: "ABORT:SURGESAG"
      - q: "TRIGGER:FORCE"
      # The guide does not document this response, so "0" is a stand-in
      - q: "SURGESAG:STATE?"
        r: "0"
      # Three-phase measurements. Without a phase argument, a three-phase instrument
      # replies with A, B and C values, as MEASURE:VOLTAGE? does here.
      - q: "MEASURE:VOLTAGE?"
        r: "220.10,219.90,220.30"
      - q: "MEASURE:VOLTAGE? A"
        r: "220.10"
      - q: "MEASURE:VOLTAGE? B"
        r: "219.90"
      - q: "MEASURE:VOLTAGE? C"
        r: "220.30"
      - q: "MEASURE:CURRENT? A"
        r: "1.10"
      - q: "MEASURE:CURRENT? B"
        r: "1.20"
      - q: "MEASURE:CURRENT? C"
        r: "1.30"
      - q: "MEASURE:LTLVOLTAGE? BA"
        r: "381.20"
      - q: "MEASURE:LTLVOLTAGE? CA"
        r: "381.00"
      - q: "MEASURE:LTLVOLTAGE? CB"
        r: "380.90"
    properties:
      voltage:
        default: 0.0
        getter:
          q: "SOURCE:VOLTAGE?"
          r: "{:.2f}"
        setter:
          q: "SOURCE:VOLTAGE {:g}"
        specs:
          type: float
      output:
        default: "OFF"
        getter:
          q: "OUTPUT?"
          r: "{:s}"
        setter:
          q: "OUTPUT {:s}"
        specs:
          valid: ["ON", "OFF"]
          type: str
      # Output mode from the IT7900P Programming Guide
      mode:
        default: "AC"
        getter:
          q: "FUNCTION?"
          r: "{:s}"
        setter:
          q: "FUNCTION {:s}"
        specs:
          valid: ["AC", "DC", "ACDC", "DCAC"]
          type: str

      # Grid simulation settings from the IT7900P Programming Guide.
      # Defaults are the guide's *RST values where it gives one, otherwise a stand-in.
      frequency:
        default: 50.0
        getter:
          q: "FREQUENCY?"
          r: "{:.2f}"
        setter:
          q: "FREQUENCY {:g}"
        specs:
          type: float
      impedance_enabled:
        default: "OFF"
        getter:
          q: "OUTPUT:IMPEDANCE?"
          r: "{:s}"
        setter:
          q: "OUTPUT:IMPEDANCE {:s}"
        specs:
          valid: ["ON", "OFF"]
          type: str
      impedance_resistance:
        default: 0.0
        getter:
          q: "OUTPUT:IMPEDANCE:RESISTANCE:LEVEL?"
          r: "{:.2f}"
        setter:
          q: "OUTPUT:IMPEDANCE:RESISTANCE:LEVEL {:g}"
        specs:
          type: float
      impedance_inductance:
        default: 0.0
        getter:
          q: "OUTPUT:IMPEDANCE:INDUCTANCE:LEVEL?"
          r: "{:.2f}"
        setter:
          q: "OUTPUT:IMPEDANCE:INDUCTANCE:LEVEL {:g}"
        specs:
          type: float
      surge_sag_mode:
        default: "PERIOD"
        getter:
          q: "SURGESAG:MODE?"
          r: "{:s}"
        setter:
          q: "SURGESAG:MODE {:s}"
        specs:
          valid: ["PERIOD", "TRIG"]
          type: str
      surge_sag_action:
        default: "IMMEDIATE"
        getter:
          q: "SURGESAG:ACTION?"
          r: "{:s}"
        setter:
          q: "SURGESAG:ACTION {:s}"
        specs:
          valid: ["IMMEDIATE", "PHASE"]
          type: str
      surge_sag_trigger_source:
        default: "MANUAL"
        getter:
          q: "TRIGGER:SURGESAG:SOURCE?"
          r: "{:s}"
        setter:
          q: "TRIGGER:SURGESAG:SOURCE {:s}"
        specs:
          valid: ["IMMEDIATE", "MANUAL", "BUS", "TRIG1", "TRIG2"]
          type: str
      surge_sag_start_phase:
        default: 0.0
        getter:
          q: "SURGESAG:PHASE:START?"
          r: "{:.2f}"
        setter:
          q: "SURGESAG:PHASE:START {:g}"
        specs:
          type: float
      surge_sag_phase_width:
        default: 0.0
        getter:
          q: "SURGESAG:PHASE:WIDTH?"
          r: "{:.2f}"
        setter:
          q: "SURGESAG:PHASE:WIDTH {:g}"
        specs:
          type: float
      surge_sag_symmetry:
        default: "OFF"
        getter:
          q: "SURGESAG:SYMMETRY?"
          r: "{:s}"
        setter:
          q: "SURGESAG:SYMMETRY {:s}"
        specs:
          valid: ["ON", "OFF"]
          type: str
      surge_sag_repeat_count:
        default: 1
        getter:
          q: "SURGESAG:REPEAT:COUNT?"
          r: "{:d}"
        setter:
          q: "SURGESAG:REPEAT:COUNT {:d}"
        specs:
          type: int
      surge_sag_period_count:
        default: 1
        getter:
          q: "SURGESAG:PERIOD:COUNT?"
          r: "{:d}"
        setter:
          q: "SURGESAG:PERIOD:COUNT {:d}"
        specs:
          type: int
      surge_sag_value_select:
        default: "PERCENT"
        getter:
          q: "SURGESAG:VALUE:SELECT?"
          r: "{:s}"
        setter:
          q: "SURGESAG:VALUE:SELECT {:s}"
        specs:
          valid: ["PERCENT", "SETTING"]
          type: str
      surge_sag_percent:
        default: 0.0
        getter:
          q: "SURGESAG:VALUE:PERCENT?"
          r: "{:.2f}"
        setter:
          q: "SURGESAG:VALUE:PERCENT {:g}"
        specs:
          type: float
      surge_sag_value:
        default: 0.0
        getter:
          q: "SURGESAG:VALUE?"
          r: "{:.2f}"
        setter:
          q: "SURGESAG:VALUE {:g}"
        specs:
          type: float
      surge_sag_phases:
        default: "ABC"
        getter:
          q: "SURGESAG:PHASE:ENABLE?"
          r: "{:s}"
        setter:
          q: "SURGESAG:PHASE:ENABLE {:s}"
        specs:
          valid: ["A", "B", "C", "AB", "AC", "BC", "ABC"]
          type: str
      surge_sag_phase_sync:
        default: "SYNC"
        getter:
          q: "SURGESAG:ANGLE:ENABLE?"
          r: "{:s}"
        setter:
          q: "SURGESAG:ANGLE:ENABLE {:s}"
        specs:
          valid: ["SYNC", "SPEC"]
          type: str

      # Three-phase settings from the IT7900P Programming Guide
      phase_mode:
        default: "ONE"
        getter:
          q: "SYSTEM:FUNCTION?"
          r: "{:s}"
        setter:
          q: "SYSTEM:FUNCTION {:s}"
        specs:
          valid: ["ONE", "THREE", "DIFFERENCE", "MULTICHANNEL"]
          type: str
      balanced:
        default: "ON"
        getter:
          q: "OUTPUT:BALANCE?"
          r: "{:s}"
        setter:
          q: "OUTPUT:BALANCE {:s}"
        specs:
          valid: ["ON", "OFF"]
          type: str
      # PVOLTAGE? replies with the phase first, as the guide documents
      phase_voltage_a:
        default: 0.0
        getter:
          q: "PVOLTAGE? A"
          r: "A,{:.2f}"
        setter:
          q: "PVOLTAGE A,{:g}"
        specs:
          type: float
      phase_voltage_b:
        default: 0.0
        getter:
          q: "PVOLTAGE? B"
          r: "B,{:.2f}"
        setter:
          q: "PVOLTAGE B,{:g}"
        specs:
          type: float
      phase_voltage_c:
        default: 0.0
        getter:
          q: "PVOLTAGE? C"
          r: "C,{:.2f}"
        setter:
          q: "PVOLTAGE C,{:g}"
        specs:
          type: float
      # The guide gives no reply format or defaults for angles; these are stand-ins
      phase_angle_ba:
        default: 120.0
        getter:
          q: "ANGLE:DIFFERENCE? BA"
          r: "{:.2f}"
        setter:
          q: "ANGLE:DIFFERENCE BA,{:g}"
        specs:
          type: float
      phase_angle_ca:
        default: 240.0
        getter:
          q: "ANGLE:DIFFERENCE? CA"
          r: "{:.2f}"
        setter:
          q: "ANGLE:DIFFERENCE CA,{:g}"
        specs:
          type: float

# 2. Bind the virtual resource address to the device above
resources:
  TCPIP0::192.168.1.100::5025::SOCKET:
    device: mock_power_supply
