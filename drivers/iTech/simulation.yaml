spec: "1.1"

# 1. Define the simulated device and how it responds to SCPI commands
devices:
  mock_power_supply:
    eom:
      TCPIP SOCKET:
        q: "\n"
        r: "\n"
    error: ERROR
    dialogues:
      # Representative IT6600C reply, in the format the ITECH programming guides document:
      # manufacturer, model, serial number, then firmware versions
      - q: "*IDN?"
        r: "Itech Electronics,IT6642C-1200-200,800000000000000001,000.001.038,83.R,13.R"
      - q: "*RST"
      - q: "MEASURE:CURRENT?"
        r: "1.234"
    properties:
      voltage:
        default: 0.0
        getter:
          q: "SOURCE:VOLTAGE?"
          r: "{:.2f}"
        setter:
          q: "SOURCE:VOLTAGE {:g}"
        specs:
          type: float
      output:
        default: "OFF"
        getter:
          q: "OUTPUT?"
          r: "{:s}"
        setter:
          q: "OUTPUT {:s}"
        specs:
          valid: ["ON", "OFF"]
          type: str

# 2. Bind the virtual resource address to the device above
resources:
  TCPIP0::192.168.1.100::5025::SOCKET:
    device: mock_power_supply
